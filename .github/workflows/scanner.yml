name: Run Quant Scanner Engine

on:
  schedule:
    # Triggers every 4 hours, Monday through Friday (UTC Time)
    - cron: '0 */4 * * 1-5'
  # Allows you to also trigger it manually from the GitHub website for testing
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & TA-Lib C-Library
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget build-essential
          wget http://sourceforge.net
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python Package Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Multi-Timeframe Scanner Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          IBKR_ENABLED: "FALSE" # Bypassed because IBKR requires a desktop interface
        run: python run_backtest.py
