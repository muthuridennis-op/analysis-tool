name: Quant Cloud Execution Engine

on:
  push:
    branches: [ main ]
  schedule:
    # Runs automatically every weekday at 22:05 UTC (5 mins after Forex Daily Close)
    - cron: '5 22 * * 1-5'

jobs:
  execute_backtest:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run Algorithm Container
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        docker build -t algo-engine .
        docker run --env SUPABASE_URL=$SUPABASE_URL \
                   --env SUPABASE_KEY=$SUPABASE_KEY \
                   algo-engine
