name: Quant Cloud Execution Engine

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */4 * * 1-5' #Triggers every 4hours, at the top of the hour,Monday through Friday

jobs:
  execute_backtest:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run Algorithm Container
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        docker build -t algo-engine .
        # FIX: Explicitly passing environmental variables directly inside the container entry layer using -e
        docker run -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" algo-engine
