name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC (11:00 EAT)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://analysis-tool-yiv5hlpnt2gjpz7yerkszg.streamlit.app/